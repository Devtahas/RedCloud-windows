[package]
name = "rust_lib_client"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
base64 = "0.22.1"
flutter_rust_bridge = "=2.12.0"
native-tls = "0.2.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
url = "2.5.8"
urlencoding = "2.1.3"

# وابستگی‌های بومی فقط و فقط مخصوص سیستم‌عامل ویندوز جهت مدیریت خودکار طول عمر فرآیندها
# با اضافه شدن ویژگی Win32_Security مشکل عدم شناسایی تابع CreateJobObjectW کاملاً برطرف می‌شود
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading"
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }