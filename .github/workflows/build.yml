name: Build and Release RedCloud VPN

on:
  push:
    branches: [ "main" ] # اجرا به محض کامیت و پوش روی برنچ اصلی
  workflow_dispatch: # امکان اجرای دستی بیلد از داخل تب Actions

permissions:
  contents: write # دسترسی لازم برای ساخت ریلیز و آپلود فایل نصبی

jobs:
  build:
    name: Build Windows Release & Package Installer
    runs-on: windows-latest

    steps:
    # ۱. کلون کردن کدهای پروژه
    - name: Checkout repository
      uses: actions/checkout@v4

    # ۲. راه‌اندازی کامپایلر Rust
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    # ۳. راه‌اندازی محیط فلاتر
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    # ۴. نصب ابزار تولید پل ارتباطی flutter_rust_bridge
    - name: Install FRB Codegen
      run: |
        cargo install flutter_rust_bridge_codegen --version 2.12.0 --locked

    # ۵. جنریت کردن کدهای پل ارتباطی Rust و Dart
    - name: Generate Rust Bridge
      run: |
        flutter_rust_bridge_codegen generate

    # ۶. دریافت وابستگی‌های فلاتر
    - name: Install Flutter dependencies
      run: flutter pub get

    # ۷. بیلد اپلیکیشن ویندوز در حالت Release
    - name: Build Windows Application (Release Mode)
      run: flutter build windows --release

    # ۸. دانلود خودکار و مستقیم تمام هسته‌های باینری از منابع اصلی و رسمی
    - name: Download Official Core Binaries (Secure & Untouched)
      shell: pwsh
      run: |
        # ایجاد پوشه مقصد Release
        New-Item -ItemType Directory -Force -Path "build\windows\x64\runner\Release"

        # ۱. دانلود آخرین نسخه رسمی موتور Aether (موتور MASQUE) از CluvexStudio
        Write-Host "Downloading official Aether engine from CluvexStudio..."
        Invoke-WebRequest -Uri "https://github.com/CluvexStudio/Aether/releases/latest/download/aether-windows-x86_64.zip" -OutFile "aether.zip"
        Expand-Archive -Path "aether.zip" -DestinationPath "temp-aether" -Force
        $aetherExe = (Get-ChildItem -Path "temp-aether" -Filter "aether.exe" -Recurse | Select-Object -First 1).FullName
        Copy-Item $aetherExe -Destination "aether.exe" -Force
        Copy-Item $aetherExe -Destination "build\windows\x64\runner\Release\aether.exe" -Force

        # ۲. دانلود نسخه رسمی sing-box 1.13.13 از مخزن رسمی SagerNet
        Write-Host "Downloading official sing-box 1.13.13 from SagerNet..."
        Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.13.13/sing-box-1.13.13-windows-amd64.zip" -OutFile "sing-box.zip"
        Expand-Archive -Path "sing-box.zip" -DestinationPath "temp-singbox" -Force
        $singboxExe = (Get-ChildItem -Path "temp-singbox" -Filter "sing-box.exe" -Recurse | Select-Object -First 1).FullName
        Copy-Item $singboxExe -Destination "sing-box.exe" -Force
        Copy-Item $singboxExe -Destination "build\windows\x64\runner\Release\sing-box.exe" -Force

        # ۳. دانلود درایور رسمی Wintun 0.14.1 مستقیماً از وبسایت رسمی Wintun.net
        Write-Host "Downloading official wintun.dll from Wintun.net..."
        Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile "wintun.zip"
        Expand-Archive -Path "wintun.zip" -DestinationPath "temp-wintun" -Force
        Copy-Item "temp-wintun\wintun\bin\amd64\wintun.dll" -Destination "wintun.dll" -Force
        Copy-Item "temp-wintun\wintun\bin\amd64\wintun.dll" -Destination "build\windows\x64\runner\Release\wintun.dll" -Force

        # ۴. دانلود پکیج رسمی Tor Expert Bundle به همراه استخراج تضمینی دیتابیس‌های geoip
        Write-Host "Downloading official Tor Expert Bundle from torproject.org..."
        Invoke-WebRequest -Uri "https://archive.torproject.org/tor-package-archive/torbrowser/14.0.8/tor-expert-bundle-windows-x86_64-14.0.8.tar.gz" -OutFile "tor.tar.gz"
        tar -xzf "tor.tar.gz" -C "."
        $torExe = (Get-ChildItem -Filter "tor.exe" -Recurse | Select-Object -First 1).FullName
        Copy-Item $torExe -Destination "tor.exe" -Force
        Copy-Item $torExe -Destination "build\windows\x64\runner\Release\tor.exe" -Force
        
        # استخراج دیتابیس‌های مکان‌یابی تور
        $geoipFile = (Get-ChildItem -Filter "geoip" -Recurse | Where-Object { -not $_.PSIsContainer -and $_.Name -eq "geoip" } | Select-Object -First 1).FullName
        if ($geoipFile) {
            Copy-Item $geoipFile -Destination "geoip" -Force
            Copy-Item $geoipFile -Destination "build\windows\x64\runner\Release\geoip" -Force
        }
        $geoip6File = (Get-ChildItem -Filter "geoip6" -Recurse | Where-Object { -not $_.PSIsContainer -and $_.Name -eq "geoip6" } | Select-Object -First 1).FullName
        if ($geoip6File) {
            Copy-Item $geoip6File -Destination "geoip6" -Force
            Copy-Item $geoip6File -Destination "build\windows\x64\runner\Release\geoip6" -Force
        }

        # ۵. دانلود نسخه رسمی ویندوز سایفون از مخزن رسمی آزمایشگاه Psiphon-Labs
        Write-Host "Downloading official Psiphon Core from Psiphon-Labs..."
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-binaries/master/windows/psiphon-tunnel-core-i686.exe" -OutFile "psiphon-tunnel-core.exe"
        Copy-Item "psiphon-tunnel-core.exe" -Destination "build\windows\x64\runner\Release\psiphon-tunnel-core.exe" -Force

        # ۶. دانلود نسخه رسمی GoodbyeDPI و درایورهای WinDivert از مخزن رسمی ValdikSS
        Write-Host "Downloading official GoodbyeDPI & WinDivert from ValdikSS..."
        Invoke-WebRequest -Uri "https://github.com/ValdikSS/GoodbyeDPI/releases/download/0.2.3rc3/goodbyedpi-0.2.3rc3-2.zip" -OutFile "goodbyedpi.zip"
        Expand-Archive -Path "goodbyedpi.zip" -DestinationPath "temp-goodbyedpi" -Force
        $gdpiX64 = (Get-ChildItem -Path "temp-goodbyedpi" -Recurse -Directory -Filter "x86_64" | Select-Object -First 1).FullName
        Copy-Item "$gdpiX64\goodbyedpi.exe" -Destination "goodbyedpi.exe" -Force
        Copy-Item "$gdpiX64\WinDivert.dll" -Destination "WinDivert.dll" -Force
        Copy-Item "$gdpiX64\WinDivert64.sys" -Destination "WinDivert64.sys" -Force
        Copy-Item "$gdpiX64\goodbyedpi.exe" -Destination "build\windows\x64\runner\Release\goodbyedpi.exe" -Force
        Copy-Item "$gdpiX64\WinDivert.dll" -Destination "build\windows\x64\runner\Release\WinDivert.dll" -Force
        Copy-Item "$gdpiX64\WinDivert64.sys" -Destination "build\windows\x64\runner\Release\WinDivert64.sys" -Force

        # ۷. دانلود رسمی dnscrypt-proxy و کانفیگ اختصاصی آن از مخزن رسمی DNSCrypt
        Write-Host "Downloading official dnscrypt-proxy from DNSCrypt..."
        $dnscryptRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/DNSCrypt/dnscrypt-proxy/releases/latest"
        $dnscryptAsset = $dnscryptRelease.assets | Where-Object { $_.name -like "dnscrypt-proxy-win64-*.zip" } | Select-Object -First 1
        Invoke-WebRequest -Uri $dnscryptAsset.browser_download_url -OutFile "dnscrypt.zip"
        Expand-Archive -Path "dnscrypt.zip" -DestinationPath "temp-dnscrypt" -Force
        $dnscryptExe = (Get-ChildItem -Path "temp-dnscrypt" -Filter "dnscrypt-proxy.exe" -Recurse | Select-Object -First 1).FullName
        Copy-Item $dnscryptExe -Destination "dnscrypt-proxy.exe" -Force
        Copy-Item $dnscryptExe -Destination "build\windows\x64\runner\Release\dnscrypt-proxy.exe" -Force
        $dnscryptExampleToml = (Get-ChildItem -Path "temp-dnscrypt" -Filter "example-dnscrypt-proxy.toml" -Recurse | Select-Object -First 1).FullName
        if ($dnscryptExampleToml) {
            Copy-Item $dnscryptExampleToml -Destination "dnscrypt-proxy.toml" -Force
            Copy-Item $dnscryptExampleToml -Destination "build\windows\x64\runner\Release\dnscrypt-proxy.toml" -Force
        }

        # ۸. دانلود رسمی udp2raw برای بهینه‌سازی و کاهش پینگ
        Write-Host "Downloading official udp2raw..."
        Invoke-WebRequest -Uri "https://github.com/wangyu-/udp2raw-multiplatform/releases/download/20230206.0/udp2raw_mp_binaries.tar.gz" -OutFile "udp2raw.tar.gz"
        tar -xzf "udp2raw.tar.gz" -C "."
        $udp2rawExe = (Get-ChildItem -Filter "udp2raw_mp_wepoll.exe" -Recurse | Select-Object -First 1).FullName
        if ($udp2rawExe) {
            Copy-Item $udp2rawExe -Destination "udp2raw.exe" -Force
            Copy-Item $udp2rawExe -Destination "build\windows\x64\runner\Release\udp2raw.exe" -Force
        }

    # ۹. نصب Inno Setup و ساخت فایل نصبی
    - name: Compile Installer with Inno Setup
      shell: pwsh
      run: |
        choco install innosetup --no-progress
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    # ۱۰. انتشار رسمی در تب Releases گیت‌هاب با نسخه 3.8
    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v3.8
        name: "RedCloud VPN v3.8 - Smart Matrix Evasion & Universal TUN Edition"
        body: |
          🚀 **انتشار رسمی نسخه ۳.۸ نرم‌افزار RedCloud VPN**
          
          ### ✨ ویژگی‌ها و تغییرات نسخه ۳.۸ (v3.8 Changelog):
          - ⚡ **هوشمندسازی ماتریسی شبکه اِتر (Smart Matrix Evasion):**
            - مجهز به الگوریتم خودآموز Fast-Path با تست زنده حافظه شبکه
            - تست ترکیبی و آبشاری مودها و نویزهای تهاجمی (Aggressive / Firewall) برای دور زدن فیلترینگ شدید
            - تفکیک قطعی اپراتورها جهت جلوگیری از تداخل حافظه همراه اول، ایرانسل و وای‌فای
          - 🌐 **حالت تونل سراسری ویندوز (Universal TUN Mode) در تمام تب‌ها:**
            - فعال‌سازی کارت شبکه مجازی در تب‌های داشبورد، اِتر، تور و سایفون
            - عبور ۱۰۰٪ ترافیک کل سیستم (بازی‌ها، دیسکورد و برنامه‌های بدون پروکسی)
            - مجهز به سیستم ضدلوپ تضمینی (Loop-Free Protection)
            - نام‌گذاری داینامیک درایور و پاکسازی خودکار کارت‌های معلق (رفع خطای Already Exists)
          - 🛡️ **سیستم ارتقای خودکار مجوزها (Auto-Elevation):**
            - درخواست خودکار دسترسی Administrator از طریق پاورشل برای کارت شبکه TUN، درایور WinDivert و DNS
          - 📦 **بسته‌بندی رسمی و دست‌نخورده هسته‌ها:**
            - تمامی هسته‌ها و درایورها (Wintun, Aether, Sing-box, Tor, Psiphon, GoodbyeDPI, DNSCrypt, udp2raw) مستقیماً حین بیلد ابری گیت‌هاب از مراجع اصلی دانلود شده‌اند.
        draft: false
        prerelease: false
        files: |
          RedCloud_VPN_Setup_*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}