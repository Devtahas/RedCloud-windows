name: Build and Release RedCloud VPN

on:
  push:
    branches: [ "main" ] # اجرا با هر بار پوش به برنچ اصلی

permissions:
  contents: write # دسترسی بسیار حیاتی برای اجازه دادن به گیت‌هاب جهت ساخت ریلیز و آپلود فایل‌ها

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Flutter dependencies
      run: flutter pub get

    - name: Build Windows Application (Release Mode)
      run: flutter build windows --release

    - name: Compile Installer with Inno Setup
      run: |
        iscc installer.iss

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest # تگ ثابت برای اینکه همیشه جدیدترین نسخه ریلیز را اوررایت کند
        name: "RedCloud VPN Latest Release"
        body: |
          این یک نسخهٔ انتشاریافتهٔ خودکار از آخرین بیلد کدهای شما در ویندوز است.
          
          **تغییرات این نسخه:**
          - فعال‌سازی کارت شبکه مجازی (TUN Mode) سیستمی
          - نمایش زنده و واقعی سرعت آپلود و دانلود
          - ویرایشگر پیشرفته کانفیگ‌های ویتوری
          - پایش موازی پینگ و مرتب‌سازی هوشمند سرورها
        draft: false
        prerelease: false
        files: |
          RedCloud_Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # توکن امنیتی خودکار گیت‌هاب برای احراز هویت
